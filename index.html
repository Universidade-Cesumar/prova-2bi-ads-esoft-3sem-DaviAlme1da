<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Sistema para Almoxarifado</title>
    <link rel='stylesheet' href='style.css'>
</head>

<body>

    <header>
        <h1>Sistema para Almoxarifado</h1>
    </header>

    <main>
        <section>
            <h2>Cadastrar Material</h2>
            <div class="campos">
                <h3>Nome</h3>
                <input type="text" id="input-nome">
            </div>

            <div class="campos">
                <h3>Unidades</h3>
                <input type="number" id="input-quantidade">
            </div>
            <button id="btn-cadastrar">Cadastrar</button>
        </section>


        <section>
            <h2>Mostrar Produtos</h2>
            <table id="lista-materiais">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Unidadades</th>
                    </tr>
                </thead>
            </table>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
